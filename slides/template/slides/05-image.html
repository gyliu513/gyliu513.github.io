<!-- Slide 05 — PNG Image -->
<section class="slide">
    <div class="slide-content">

        <div class="badge badge-orange reveal">Visual</div>
        <h2 class="reveal">Image Slide</h2>

        <!--
            Replace "images/your-image.png" with your actual path.
            Paths are relative to index.html (the presentation root).
            Examples:
                images/diagram.png          ← put files in slides/template/images/
                ../shared/screenshot.png    ← one level up
                https://...                 ← remote URL also works
        -->
        <div class="reveal" style="
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 360px;
        ">
            <img
                src="images/your-image.png"
                alt="Slide image"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                style="
                    max-width: 100%;
                    max-height: 55vh;
                    display: block;
                    border-radius: 4px;
                "
            >
            <!-- Placeholder shown when image is missing -->
            <div style="
                display: none;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                padding: 48px;
                color: var(--text-faint);
                text-align: center;
            ">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
                <p style="font-family:var(--font-mono); font-size:13px;">
                    Put your image at<br>
                    <span style="color:var(--orange);">slides/template/images/your-image.png</span>
                </p>
            </div>
        </div>

        <!-- Optional caption -->
        <p class="text-muted reveal mt-md" style="font-size:13px; text-align:center;">
            Caption or source note goes here
        </p>

    </div>
</section>
