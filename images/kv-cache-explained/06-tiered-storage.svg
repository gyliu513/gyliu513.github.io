<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 734" width="960" height="734" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="960" height="734" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Figure 6&#160;&#160;Tiered KV Cache Storage (Offloading)</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#4b5563">KV cache that does not fit in GPU memory is stored in lower tiers and moved back when needed,</text>
  <text x="480" y="80" text-anchor="middle" font-size="14" fill="#4b5563">which gives the KV cache a multi-level cache of its own</text>

  <g transform="translate(0,18)">
  <!-- side arrows -->
  <line x1="60" y1="262" x2="60" y2="90" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="60" y1="282" x2="60" y2="440" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text transform="translate(40,176) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Faster, costlier per GB</text>
  <text transform="translate(40,361) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Larger, shareable</text>

  <!-- tiers -->
  <rect x="230" y="86" width="240" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="350" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">GPU memory (HBM)</text>
  <text x="350" y="134" text-anchor="middle" font-size="12" fill="#5b21b6">Fastest, smallest, tens of GB</text>

  <rect x="200" y="180" width="300" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">CPU memory (DRAM)</text>
  <text x="350" y="228" text-anchor="middle" font-size="12" fill="#1e40af">Fast, hundreds of GB to TB</text>

  <rect x="160" y="274" width="380" height="64" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="350" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a">Local NVMe SSD</text>
  <text x="350" y="322" text-anchor="middle" font-size="12" fill="#115e59">TB-scale, private to one machine</text>

  <rect x="100" y="368" width="500" height="72" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="350" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Shared storage / distributed file system / object storage</text>
  <text x="350" y="420" text-anchor="middle" font-size="12" fill="#334155">Largest, shareable across nodes</text>

  <!-- inter-tier flows: orange down = offload, green up = load -->
  <g stroke-width="2" fill="none">
    <line x1="310" y1="152" x2="310" y2="177" stroke="#ea580c" marker-end="url(#arrO)"/>
    <line x1="390" y1="177" x2="390" y2="152" stroke="#16a34a" marker-end="url(#arrG)"/>
    <line x1="310" y1="246" x2="310" y2="271" stroke="#ea580c" marker-end="url(#arrO)"/>
    <line x1="390" y1="271" x2="390" y2="246" stroke="#16a34a" marker-end="url(#arrG)"/>
    <line x1="310" y1="340" x2="310" y2="365" stroke="#ea580c" marker-end="url(#arrO)"/>
    <line x1="390" y1="365" x2="390" y2="340" stroke="#16a34a" marker-end="url(#arrG)"/>
  </g>
  <g font-size="12">
    <text x="300" y="170" text-anchor="end" fill="#c2410c">Offload</text>
    <text x="400" y="170" fill="#15803d">Load</text>
    <text x="300" y="264" text-anchor="end" fill="#c2410c">Offload</text>
    <text x="400" y="264" fill="#15803d">Load</text>
    <text x="300" y="358" text-anchor="end" fill="#c2410c">Offload</text>
    <text x="400" y="358" fill="#15803d">Load</text>
  </g>

  <!-- explanation boxes -->
  <rect x="610" y="86" width="326" height="106" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="626" y="112" font-size="14" font-weight="700" fill="#9a3412">① GPU memory is full</text>
  <text x="626" y="137" font-size="13" fill="#7c2d12">Evicted KV blocks are not discarded;</text>
  <text x="626" y="159" font-size="13" fill="#7c2d12">they are offloaded to the next tier</text>
  <text x="626" y="181" font-size="12" fill="#9a3412">The less a block is used, the lower it goes</text>

  <rect x="610" y="204" width="326" height="130" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="626" y="230" font-size="14" font-weight="700" fill="#166534">② The same prefix shows up again</text>
  <text x="626" y="254" font-size="13" fill="#14532d">On a lower-tier hit, load KV back to GPU</text>
  <text x="626" y="276" font-size="13" fill="#14532d">Loading is usually far faster than prefill</text>
  <text x="626" y="298" font-size="13" fill="#14532d">The longer the prefix, the more it saves</text>
  <text x="626" y="321" font-size="12" fill="#15803d">Only a miss needs computing from scratch</text>

  <rect x="610" y="346" width="326" height="94" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="626" y="368" font-size="13" font-weight="700" fill="#374151">Open-source examples</text>
  <text x="626" y="389" font-size="12" fill="#6b7280">vLLM: KV offloading, LMCache</text>
  <text x="626" y="407" font-size="12" fill="#6b7280">llm-d: file system backend</text>
  <text x="626" y="425" font-size="12" fill="#6b7280">SGLang: HiCache</text>

  <!-- routing weights note -->
  <rect x="24" y="460" width="912" height="122" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="44" y="486" font-size="15" font-weight="700" fill="#3730a3">Routing can weight hits by tier</text>
  <text x="290" y="486" font-size="13" fill="#4338ca">The faster the tier a hit is in, the higher the machine scores. llm-d default weights:</text>
  <g font-size="13" fill="#1f2937">
    <text x="44" y="516">GPU memory</text>
    <text x="44" y="540">CPU memory</text>
    <text x="44" y="564">Local storage</text>
    <text x="520" y="516">Shared storage</text>
    <text x="520" y="540">Object storage</text>
  </g>
  <!-- bars: 300 px = 1.0 -->
  <rect x="140" y="504" width="300" height="16" rx="3" fill="#7c3aed"/>
  <rect x="140" y="528" width="240" height="16" rx="3" fill="#2563eb"/>
  <rect x="140" y="552" width="180" height="16" rx="3" fill="#0d9488"/>
  <rect x="630" y="504" width="120" height="16" rx="3" fill="#475569"/>
  <rect x="630" y="528" width="60" height="16" rx="3" fill="#94a3b8"/>
  <g font-size="13" font-weight="700" fill="#1f2937">
    <text x="448" y="517">1.0</text>
    <text x="388" y="541">0.8</text>
    <text x="328" y="565">0.6</text>
    <text x="758" y="517">0.4</text>
    <text x="698" y="541">0.2</text>
  </g>
  <text x="520" y="565" font-size="12" fill="#6b7280">Faster tier, higher weight: routing favors hits in fast tiers</text>

  <!-- legend / takeaway -->
  <rect x="24" y="598" width="912" height="100" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <line x1="56" y1="632" x2="56" y2="610" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="42" y1="610" x2="42" y2="632" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="70" y="626" font-size="13" fill="#374151"><tspan fill="#c2410c" font-weight="700">Orange, down</tspan>: offload to a lower tier&#160;&#160;&#160;&#160;<tspan fill="#15803d" font-weight="700">Green, up</tspan>: load back to GPU on a hit</text>
  <text x="44" y="658" font-size="13" font-weight="700" fill="#1f2937">Key point: tiered storage frees KV cache capacity from the memory limit of a single GPU.</text>
  <text x="44" y="680" font-size="13" font-weight="700" fill="#1f2937">Hot data stays in upper tiers and cold data moves down; loading it back on a hit costs less than recomputing it.</text>
  </g>
</svg>
