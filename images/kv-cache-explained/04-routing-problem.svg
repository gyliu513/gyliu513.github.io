<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 598" width="960" height="598" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="960" height="598" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937" xml:space="preserve">Figure 4  Multi-Replica Problem: Plain Load Balancing Can't See KV Cache</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#4b5563">Scenario: 3 turns of the same multi-turn chat; each turn carries the full history so far (the prefix keeps growing)</text>

  <!-- LEFT -->
  <rect x="20" y="80" width="450" height="420" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="245" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">Round-robin / random / least-connections</text>
  <text x="245" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">load balancing</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="150" width="110" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="95" y="172" fill="#312e81">Turn 1</text>
    <rect x="40" y="220" width="110" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="95" y="242" fill="#312e81">Turn 2</text>
    <rect x="40" y="290" width="110" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="95" y="312" fill="#312e81">Turn 3</text>
  </g>
  <g font-size="13">
    <rect x="290" y="144" width="160" height="58" rx="8" fill="#ffffff" stroke="#6b7280"/><text x="370" y="166" text-anchor="middle" font-weight="700" fill="#111827">Pod 1</text><text x="370" y="188" text-anchor="middle" fill="#6b7280" font-size="12">Cached Turn 1 prefix</text>
    <rect x="290" y="214" width="160" height="58" rx="8" fill="#ffffff" stroke="#6b7280"/><text x="370" y="236" text-anchor="middle" font-weight="700" fill="#111827">Pod 2</text><text x="370" y="258" text-anchor="middle" fill="#6b7280" font-size="12">No Turn 2 prefix</text>
    <rect x="290" y="284" width="160" height="58" rx="8" fill="#ffffff" stroke="#6b7280"/><text x="370" y="306" text-anchor="middle" font-weight="700" fill="#111827">Pod 3</text><text x="370" y="328" text-anchor="middle" fill="#6b7280" font-size="12">No Turn 3 prefix</text>
  </g>
  <line x1="150" y1="167" x2="286" y2="170" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="150" y1="237" x2="286" y2="240" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="150" y1="307" x2="286" y2="310" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <g font-size="12" fill="#b91c1c" text-anchor="middle"><text x="218" y="160">miss</text><text x="218" y="230">miss, full Prefill</text><text x="218" y="300">miss, full Prefill</text></g>
  <rect x="40" y="364" width="410" height="120" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <g font-size="13" fill="#7f1d1d">
    <text x="56" y="390">✗ Every turn Prefills from scratch; the chat gets slower</text>
    <text x="56" y="416">✗ The same prefix is stored on all 3 Pods, wasting GPU memory</text>
    <text x="56" y="442">✗ GPU compute goes to repeated work; throughput drops</text>
    <text x="56" y="468">✗ Overall prefix hit rate across N Pods is close to 1/N</text>
  </g>

  <!-- RIGHT -->
  <rect x="490" y="80" width="450" height="420" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="715" y="119" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">KV Cache-aware routing (llm-d Router)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="510" y="150" width="110" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="565" y="172" fill="#312e81">Turn 1</text>
    <rect x="510" y="220" width="110" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="565" y="242" fill="#312e81">Turn 2</text>
    <rect x="510" y="290" width="110" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="565" y="312" fill="#312e81">Turn 3</text>
  </g>
  <g font-size="13">
    <rect x="760" y="144" width="160" height="58" rx="8" fill="#ffffff" stroke="#d1d5db"/><text x="840" y="166" text-anchor="middle" font-weight="700" fill="#9ca3af">Pod 1</text><text x="840" y="188" text-anchor="middle" fill="#9ca3af" font-size="12">Serving other requests</text>
    <rect x="760" y="214" width="160" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="840" y="236" text-anchor="middle" font-weight="700" fill="#14532d">Pod 2</text><text x="840" y="258" text-anchor="middle" fill="#166534" font-size="12">Holds this chat's prefix</text>
    <rect x="760" y="284" width="160" height="58" rx="8" fill="#ffffff" stroke="#d1d5db"/><text x="840" y="306" text-anchor="middle" font-weight="700" fill="#9ca3af">Pod 3</text><text x="840" y="328" text-anchor="middle" fill="#9ca3af" font-size="12">Serving other requests</text>
  </g>
  <line x1="620" y1="167" x2="756" y2="234" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="620" y1="237" x2="756" y2="242" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="620" y1="307" x2="756" y2="252" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <g font-size="12" fill="#15803d" text-anchor="middle"><text x="688" y="158">Turn 1: pick by load</text><text x="668" y="231">prefix hit</text><text x="676" y="314">prefix hit</text></g>
  <rect x="510" y="364" width="410" height="120" rx="8" fill="#ffffff" stroke="#86efac"/>
  <g font-size="13" fill="#14532d">
    <text x="526" y="390">✓ Turns 2 and 3 only Prefill the small new part</text>
    <text x="526" y="416">✓ Each prefix is stored once; GPU memory serves more requests</text>
    <text x="526" y="442">✓ Also weighs load, so hot Pods are not overloaded</text>
    <text x="526" y="468">✓ Lower TTFT, higher throughput, lower cost per token</text>
  </g>

  <rect x="20" y="516" width="920" height="66" rx="8" fill="#f3f4f6"/>
  <text x="480" y="543" text-anchor="middle" font-size="14" fill="#111827">Core problem: the routing layer needs to know <tspan font-weight="700">"which Pod has already cached how long a prefix of this request"</tspan>,</text>
  <text x="480" y="565" text-anchor="middle" font-size="14" fill="#111827">and weigh that together with load</text>
</svg>
