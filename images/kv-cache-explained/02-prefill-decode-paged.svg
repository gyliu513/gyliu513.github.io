<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" width="960" height="670" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="960" height="670" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937" xml:space="preserve">Figure 2  The Two Phases of Inference, and What KV Cache Looks Like in GPU Memory</text>

  <!-- Part A: prefill / decode -->
  <text x="32" y="76" font-size="16" font-weight="700" fill="#111827">A. One request = Prefill + Decode</text>
  <rect x="32" y="92" width="400" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="232" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Prefill phase</text>
  <text x="232" y="142" text-anchor="middle" font-size="13" fill="#78350f">Processes the whole prompt in parallel, in one pass</text>
  <text x="232" y="160" text-anchor="middle" font-size="13" fill="#78350f">(possibly tens of thousands of tokens)</text>
  <text x="232" y="180" text-anchor="middle" font-size="13" fill="#78350f">Computes K, V for every prompt token into KV Cache</text>
  <text x="232" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Compute-bound</text>
  <text x="232" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">→ sets time to first token (TTFT)</text>

  <line x1="436" y1="162" x2="520" y2="162" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="478" y="152" text-anchor="middle" font-size="12" fill="#374151">outputs</text>
  <text x="478" y="182" text-anchor="middle" font-size="12" fill="#374151">1st token</text>

  <rect x="528" y="92" width="400" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="728" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Decode phase</text>
  <text x="728" y="142" text-anchor="middle" font-size="13" fill="#14532d">Computes only 1 new token per turn,</text>
  <text x="728" y="160" text-anchor="middle" font-size="13" fill="#14532d">looping until the end</text>
  <text x="728" y="180" text-anchor="middle" font-size="13" fill="#14532d">Each turn reads all past K, V and appends new K, V</text>
  <text x="728" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">GPU memory bandwidth-bound</text>
  <text x="728" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">→ sets time per output token (TPOT)</text>

  <rect x="32" y="246" width="896" height="56" rx="8" fill="#f3f4f6"/>
  <text x="480" y="268" text-anchor="middle" font-size="14" fill="#111827">Key point: if the prompt's prefix has already been computed, <tspan font-weight="700" fill="#b91c1c">Prefill can skip that part entirely</tspan>,</text>
  <text x="480" y="290" text-anchor="middle" font-size="14" fill="#111827">so TTFT drops sharply and the GPU saves compute</text>

  <!-- Part B: paged KV cache -->
  <text x="32" y="336" font-size="16" font-weight="700" fill="#111827">B. Inference engines (e.g. vLLM) manage KV Cache in fixed-size blocks (PagedAttention)</text>

  <!-- request rows -->
  <text x="32" y="376" font-size="14" font-weight="700" fill="#1f2937">Request A</text>
  <g font-size="12" text-anchor="middle">
    <rect x="130" y="358" width="150" height="28" rx="5" fill="#c7d2fe" stroke="#4f46e5"/><text x="205" y="377" fill="#312e81">System prompt part 1</text>
    <rect x="286" y="358" width="150" height="28" rx="5" fill="#c7d2fe" stroke="#4f46e5"/><text x="361" y="377" fill="#312e81">System prompt part 2</text>
    <rect x="442" y="358" width="150" height="28" rx="5" fill="#fde68a" stroke="#d97706"/><text x="517" y="377" fill="#78350f">A's question</text>
  </g>
  <text x="32" y="422" font-size="14" font-weight="700" fill="#1f2937">Request B</text>
  <g font-size="12" text-anchor="middle">
    <rect x="130" y="404" width="150" height="28" rx="5" fill="#c7d2fe" stroke="#4f46e5"/><text x="205" y="423" fill="#312e81">System prompt part 1</text>
    <rect x="286" y="404" width="150" height="28" rx="5" fill="#c7d2fe" stroke="#4f46e5"/><text x="361" y="423" fill="#312e81">System prompt part 2</text>
    <rect x="442" y="404" width="150" height="28" rx="5" fill="#a7f3d0" stroke="#059669"/><text x="517" y="423" fill="#064e3b">B's question</text>
  </g>
  <text x="620" y="372" font-size="12" fill="#4b5563">Each part = 1 block</text>
  <text x="620" y="390" font-size="12" fill="#4b5563">(vLLM default: 16 tokens)</text>
  <text x="620" y="414" font-size="12" fill="#4b5563">Block key = hash of the prefix content</text>
  <text x="620" y="432" font-size="12" fill="#4b5563">Same prefix → same key → reusable</text>

  <!-- GPU memory -->
  <rect x="32" y="458" width="896" height="120" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="912" y="482" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">GPU memory of one Pod: KV Cache block pool</text>
  <g font-size="12" text-anchor="middle">
    <rect x="48" y="496" width="96" height="40" rx="5" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/><text x="96" y="513" fill="#312e81">block #7</text><text x="96" y="529" fill="#312e81">sys prompt 1</text>
    <rect x="152" y="496" width="96" height="40" rx="5" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/><text x="200" y="513" fill="#312e81">block #3</text><text x="200" y="529" fill="#312e81">sys prompt 2</text>
    <rect x="256" y="496" width="96" height="40" rx="5" fill="#fde68a" stroke="#d97706"/><text x="304" y="513" fill="#78350f">block #9</text><text x="304" y="529" fill="#78350f">A's question</text>
    <rect x="360" y="496" width="96" height="40" rx="5" fill="#a7f3d0" stroke="#059669"/><text x="408" y="513" fill="#064e3b">block #1</text><text x="408" y="529" fill="#064e3b">B's question</text>
    <rect x="464" y="496" width="80" height="40" rx="5" fill="#e5e7eb" stroke="#9ca3af" stroke-dasharray="4 3"/><text x="504" y="521" fill="#6b7280">free</text>
    <rect x="552" y="496" width="80" height="40" rx="5" fill="#e5e7eb" stroke="#9ca3af" stroke-dasharray="4 3"/><text x="592" y="521" fill="#6b7280">free</text>
    <rect x="640" y="496" width="128" height="40" rx="5" fill="#fecaca" stroke="#dc2626"/><text x="704" y="513" fill="#7f1d1d">block #5</text><text x="704" y="529" fill="#7f1d1d">old request (to evict)</text>
    <rect x="776" y="496" width="136" height="40" rx="5" fill="#ffffff" stroke="#9ca3af"/><text x="844" y="513" fill="#6b7280">… tens of thousands</text><text x="844" y="529" fill="#6b7280">of blocks in total</text>
  </g>
  <text x="48" y="560" font-size="12" fill="#334155">A and B share blocks #7 and #3, so B's Prefill only computes #1. When memory is full, unused blocks (e.g. #5) are evicted by LRU.</text>

  <!-- arrows from requests to blocks -->
  <path d="M205,432 C205,460 96,470 96,496" fill="none" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M361,432 C361,460 200,470 200,496" fill="none" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="32" y="596" width="896" height="58" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="480" y="620" text-anchor="middle" font-size="14" fill="#7f1d1d">This is single-machine <tspan font-weight="700">Prefix Caching</tspan>: it only works within the same Pod.</text>
  <text x="480" y="642" text-anchor="middle" font-size="14" fill="#7f1d1d">If B is routed to another Pod without #7 and #3, it must Prefill from scratch. This is the problem distributed routing solves.</text>
</svg>
