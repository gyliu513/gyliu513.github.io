<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" width="960" height="820" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="960" height="820" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Figure 5&#160;&#160;The Three-Layer Architecture of the KV Cache System</text>

  <!-- Layer 1 cluster -->
  <rect x="20" y="56" width="920" height="196" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="38" y="82" font-size="15" font-weight="700" fill="#1e3a8a">① Cluster layer: decides which inference instance gets the request</text>
  <rect x="40" y="104" width="160" height="64" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="120" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Client</text>
  <text x="120" y="151" text-anchor="middle" font-size="12" fill="#4b5563">Sends inference requests</text>
  <line x1="200" y1="136" x2="226" y2="136" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/>
  <rect x="230" y="96" width="300" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">KV-cache-aware router</text>
  <text x="380" y="143" text-anchor="middle" font-size="12" fill="#1e40af">Scores on prefix hits and current load</text>
  <text x="380" y="164" text-anchor="middle" font-size="12" fill="#1e40af">e.g. the llm-d Router's Endpoint Picker</text>
  <line x1="530" y1="138" x2="584" y2="138" stroke="#374151" stroke-width="2" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="557" y="128" text-anchor="middle" font-size="12" fill="#374151">Query</text>
  <rect x="588" y="96" width="332" height="84" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="754" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">Global KV index</text>
  <text x="754" y="143" text-anchor="middle" font-size="12" fill="#9a3412">block key → {holding instance, tier}</text>
  <text x="754" y="164" text-anchor="middle" font-size="12" fill="#9a3412">Local memory, or a shared store such as Redis</text>
  <rect x="230" y="190" width="230" height="48" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="345" y="210" text-anchor="middle" font-size="12" fill="#1e40af">Load signals:</text>
  <text x="345" y="227" text-anchor="middle" font-size="12" fill="#1e40af">queue length, GPU memory usage</text>

  <!-- Layer 2 engine -->
  <rect x="20" y="268" width="920" height="248" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="38" y="294" font-size="15" font-weight="700" fill="#14532d">② Engine layer: each instance manages its own KV cache</text>
  <rect x="40" y="306" width="560" height="196" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="56" y="330" font-size="14" font-weight="700" fill="#14532d">Inference instance A (e.g. vLLM, SGLang)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="56" y="342" width="160" height="64" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="136" y="366" font-size="13" font-weight="700" fill="#14532d">Request scheduler</text>
    <text x="136" y="386" fill="#166534">Continuous batching</text>
    <rect x="230" y="342" width="170" height="64" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="315" y="362" font-size="13" font-weight="700" fill="#14532d">Block manager</text>
    <text x="315" y="381" fill="#166534">Allocation, ref counting,</text>
    <text x="315" y="397" fill="#166534">LRU eviction</text>
    <rect x="414" y="342" width="170" height="64" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="499" y="362" font-size="13" font-weight="700" fill="#14532d">Prefix cache table</text>
    <text x="499" y="381" fill="#166534">block key →</text>
    <text x="499" y="397" fill="#166534">physical block</text>
    <rect x="56" y="420" width="160" height="64" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="136" y="440" font-size="13" font-weight="700" fill="#14532d">Attention compute</text>
    <text x="136" y="459" fill="#166534">Reads/writes K and V</text>
    <text x="136" y="475" fill="#166534">on the GPU</text>
    <rect x="230" y="420" width="354" height="64" rx="7" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="407" y="440" font-size="13" font-weight="700" fill="#4c1d95">KV Connector</text>
    <text x="407" y="459" fill="#5b21b6">Unified interface to offload and load KV</text>
    <text x="407" y="475" fill="#5b21b6">and transfer it across nodes</text>
  </g>
  <rect x="620" y="306" width="148" height="196" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="694" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Inference</text>
  <text x="694" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">instance B</text>
  <text x="694" y="374" text-anchor="middle" font-size="12" fill="#166534">Same internals as A</text>
  <rect x="786" y="306" width="148" height="196" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="860" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Inference</text>
  <text x="860" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">instance N</text>
  <text x="860" y="374" text-anchor="middle" font-size="12" fill="#166534">Same internals as A</text>
  <line x1="586" y1="452" x2="618" y2="452" stroke="#7c3aed" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="694" y="448" text-anchor="middle" font-size="12" fill="#5b21b6">With P/D</text>
  <text x="694" y="464" text-anchor="middle" font-size="12" fill="#5b21b6">disaggregation,</text>
  <text x="694" y="480" text-anchor="middle" font-size="12" fill="#5b21b6">exchanges KV with A</text>

  <!-- request arrow -->
  <line x1="490" y1="180" x2="490" y2="338" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/>
  <rect x="348" y="248" width="136" height="20" fill="#eff6ff"/>
  <text x="482" y="263" text-anchor="end" font-size="12" fill="#1d4ed8">Forward to instance A</text>
  <!-- events -->
  <path d="M584,360 L604,360 L604,200 L640,180" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <line x1="720" y1="306" x2="720" y2="184" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <line x1="860" y1="306" x2="860" y2="184" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <rect x="724" y="226" width="132" height="40" fill="#f0fdf4"/>
  <text x="790" y="242" text-anchor="middle" font-size="12" fill="#c2410c">KV events: blocks</text>
  <text x="790" y="259" text-anchor="middle" font-size="12" fill="#c2410c">stored / removed</text>

  <!-- Layer 3 storage -->
  <rect x="20" y="532" width="920" height="136" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="38" y="558" font-size="15" font-weight="700" fill="#581c87">③ Storage and transfer layer: where KV cache is kept and moved</text>
  <line x1="570" y1="484" x2="570" y2="574" stroke="#7c3aed" stroke-width="2"/>
  <line x1="125" y1="574" x2="854" y2="574" stroke="#7c3aed" stroke-width="2"/>
  <g stroke="#7c3aed" stroke-width="2">
    <line x1="125" y1="574" x2="125" y2="590" marker-end="url(#g)"/>
    <line x1="310" y1="574" x2="310" y2="590" marker-end="url(#g)"/>
    <line x1="495" y1="574" x2="495" y2="590" marker-end="url(#g)"/>
    <line x1="680" y1="574" x2="680" y2="590" marker-end="url(#g)"/>
    <line x1="854" y1="574" x2="854" y2="590" marker-end="url(#g)"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="592" width="170" height="62" rx="8" fill="#bbf7d0" stroke="#16a34a"/><text x="125" y="616" font-size="13" font-weight="700" fill="#14532d">GPU memory (HBM)</text><text x="125" y="636" fill="#166534">Fastest, least capacity</text>
    <rect x="225" y="592" width="170" height="62" rx="8" fill="#bae6fd" stroke="#0284c7"/><text x="310" y="612" font-size="13" font-weight="700" fill="#0c4a6e">CPU memory</text><text x="310" y="630" fill="#075985">Fast, several times</text><text x="310" y="645" fill="#075985">larger capacity</text>
    <rect x="410" y="592" width="170" height="62" rx="8" fill="#e9d5ff" stroke="#9333ea"/><text x="495" y="616" font-size="13" font-weight="700" fill="#581c87">Local SSD</text><text x="495" y="636" fill="#6b21a8">TB-scale, persistent</text>
    <rect x="595" y="592" width="170" height="62" rx="8" fill="#fae8ff" stroke="#c026d3"/><text x="680" y="612" font-size="13" font-weight="700" fill="#701a75">Shared/object storage</text><text x="680" y="630" fill="#86198f">Largest, shareable</text><text x="680" y="645" fill="#86198f">across nodes</text>
    <rect x="780" y="592" width="148" height="62" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="854" y="609" font-size="13" font-weight="700" fill="#78350f">High-speed</text><text x="854" y="625" font-size="13" font-weight="700" fill="#78350f">inter-node network</text><text x="854" y="644" fill="#92400e">RDMA / NVLink</text>
  </g>

  <!-- legend -->
  <rect x="20" y="684" width="920" height="122" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <line x1="40" y1="710" x2="90" y2="710" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="100" y="715" font-size="13" fill="#374151">Inference request</text>
  <line x1="260" y1="710" x2="310" y2="710" stroke="#7c3aed" stroke-width="2" marker-end="url(#g)"/>
  <text x="320" y="715" font-size="13" fill="#374151">KV data offload, load, and transfer</text>
  <line x1="40" y1="738" x2="90" y2="738" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="100" y="743" font-size="13" fill="#374151">KV events (tell the router what each instance has cached)</text>
  <text x="40" y="770" font-size="13" fill="#374151">Division of labor: the engine layer keeps KV stored and usable; the storage layer holds more of it and moves it fast;</text>
  <text x="40" y="790" font-size="13" fill="#374151">the cluster layer sends each request to where its cache already is.</text>
</svg>
