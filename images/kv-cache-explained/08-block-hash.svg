<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 604" width="960" height="604" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>
  <rect width="960" height="604" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Figure 8&#160;&#160;Prefix Fingerprints: Turning Tokens into a Chain of Block Keys</text>

  <text x="30" y="80" font-size="15" font-weight="700" fill="#111827">Step 1&#160;&#160;Split into blocks: cut tokens into fixed-size blocks (16 tokens per block here)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="96" width="180" height="40" rx="6" fill="#c7d2fe" stroke="#4f46e5"/><text x="150" y="121" fill="#312e81">Block 0: tokens 1–16</text>
    <rect x="250" y="96" width="180" height="40" rx="6" fill="#c7d2fe" stroke="#4f46e5"/><text x="340" y="121" fill="#312e81">Block 1: tokens 17–32</text>
    <rect x="440" y="96" width="180" height="40" rx="6" fill="#c7d2fe" stroke="#4f46e5"/><text x="530" y="121" fill="#312e81">Block 2: tokens 33–48</text>
    <rect x="630" y="96" width="180" height="40" rx="6" fill="#c7d2fe" stroke="#4f46e5"/><text x="720" y="121" fill="#312e81">Block 3: tokens 49–64</text>
    <rect x="820" y="96" width="110" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="4 3"/><text x="875" y="114" fill="#6b7280" font-size="12">Partial tail</text><text x="875" y="129" fill="#6b7280" font-size="12">is not matched</text>
  </g>

  <text x="30" y="162" font-size="15" font-weight="700" fill="#111827">Step 2&#160;&#160;Chained hash: each block's key = hash(previous block's key, this block's tokens, extra info)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="200" width="180" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="150" y="223" font-weight="700" fill="#78350f">key0</text><text x="150" y="243" font-size="12" fill="#92400e">hash(seed, block 0)</text>
    <rect x="250" y="200" width="180" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="340" y="223" font-weight="700" fill="#78350f">key1</text><text x="340" y="243" font-size="12" fill="#92400e">hash(key0, block 1)</text>
    <rect x="440" y="200" width="180" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="530" y="223" font-weight="700" fill="#78350f">key2</text><text x="530" y="243" font-size="12" fill="#92400e">hash(key1, block 2)</text>
    <rect x="630" y="200" width="180" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="720" y="223" font-weight="700" fill="#78350f">key3</text><text x="720" y="243" font-size="12" fill="#92400e">hash(key2, block 3)</text>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="150" y1="170" x2="150" y2="196" marker-end="url(#k)"/>
    <line x1="340" y1="170" x2="340" y2="196" marker-end="url(#k)"/>
    <line x1="530" y1="170" x2="530" y2="196" marker-end="url(#k)"/>
    <line x1="720" y1="170" x2="720" y2="196" marker-end="url(#k)"/>
  </g>
  <g stroke="#b45309" stroke-width="2.5">
    <line x1="240" y1="228" x2="248" y2="228" marker-end="url(#r)"/>
    <line x1="430" y1="228" x2="438" y2="228" marker-end="url(#r)"/>
    <line x1="620" y1="228" x2="628" y2="228" marker-end="url(#r)"/>
  </g>
  <rect x="820" y="186" width="110" height="82" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="875" y="204" text-anchor="middle" font-size="11" fill="#4b5563">Extra info, e.g.:</text>
  <text x="875" y="221" text-anchor="middle" font-size="11" fill="#4b5563">multimodal IDs</text>
  <text x="875" y="238" text-anchor="middle" font-size="11" fill="#4b5563">(images, etc.)</text>
  <text x="875" y="255" text-anchor="middle" font-size="11" fill="#4b5563">LoRA, cache salt</text>

  <rect x="30" y="280" width="900" height="154" rx="10" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="50" y="306" font-size="15" font-weight="700" fill="#0c4a6e">Why "chained"?</text>
  <text x="50" y="332" font-size="13" fill="#075985">key2 includes key1, and key1 includes key0, so <tspan font-weight="700">key2 matches if and only if the first 48 tokens are identical</tspan>.</text>
  <text x="50" y="356" font-size="13" fill="#075985">Matching compares keys only, not tokens one by one. If any block in the middle differs, every key after it differs too,</text>
  <text x="50" y="378" font-size="13" fill="#075985">so the scheme naturally follows prefix semantics.</text>
  <text x="50" y="402" font-size="13" fill="#075985">This is the same rule the inference engine uses to decide whether a block can be reused: KV can only be reused by prefix,</text>
  <text x="50" y="424" font-size="13" fill="#075985">because each token's K and V depend on all the content before it.</text>

  <text x="30" y="468" font-size="15" font-weight="700" fill="#111827">Step 3&#160;&#160;The read and write sides compute keys with the same algorithm, so the keys match</text>
  <rect x="30" y="482" width="420" height="104" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="240" y="506" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Read: a new request arrives</text>
  <text x="240" y="530" text-anchor="middle" font-size="13" fill="#1e40af">The router computes key0 … keyN from its tokens</text>
  <text x="240" y="552" text-anchor="middle" font-size="13" fill="#1e40af">and looks them up: which instances hold these keys</text>
  <text x="240" y="574" text-anchor="middle" font-size="12" fill="#3b82f6">(All in memory, usually much faster than one prefill)</text>
  <text x="480" y="544" text-anchor="middle" font-size="26" font-weight="700" fill="#16a34a">=</text>
  <rect x="510" y="482" width="420" height="104" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="720" y="506" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Write: the engine reports "stored a block"</text>
  <text x="720" y="530" text-anchor="middle" font-size="13" fill="#9a3412">The event carries the block's tokens and parent block</text>
  <text x="720" y="552" text-anchor="middle" font-size="13" fill="#9a3412">Recompute the key the same way, write it to the index</text>
  <text x="720" y="574" text-anchor="middle" font-size="12" fill="#c2410c">(In llm-d, the engine's own hash is used only for mapping)</text>
</svg>
