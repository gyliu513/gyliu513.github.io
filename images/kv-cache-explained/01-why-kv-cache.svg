<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937" xml:space="preserve">Figure 1  Why KV Cache: Repeated Computation in Autoregressive Generation</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#4b5563">The model generates 1 token at a time; attention at Step t needs the Key and Value vectors of all previous tokens</text>

  <!-- Left panel -->
  <rect x="24" y="80" width="444" height="380" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="246" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">Without KV Cache</text>
  <text x="246" y="132" text-anchor="middle" font-size="13" fill="#7c2d12">Every step recomputes K and V for all past tokens</text>
  <!-- column headers -->
  <g font-size="13" fill="#374151" text-anchor="middle">
    <text x="150" y="160">token1</text><text x="214" y="160">token2</text><text x="278" y="160">token3</text><text x="342" y="160">token4</text><text x="406" y="160">token5</text>
  </g>
  <g font-size="13" fill="#374151">
    <text x="40" y="193">Step 1</text><text x="40" y="237">Step 2</text><text x="40" y="281">Step 3</text><text x="40" y="325">Step 4</text><text x="40" y="369">Step 5</text>
  </g>
  <g fill="#fb923c" stroke="#c2410c" stroke-width="1">
    <rect x="122" y="172" width="56" height="32" rx="5"/>
    <rect x="122" y="216" width="56" height="32" rx="5"/><rect x="186" y="216" width="56" height="32" rx="5"/>
    <rect x="122" y="260" width="56" height="32" rx="5"/><rect x="186" y="260" width="56" height="32" rx="5"/><rect x="250" y="260" width="56" height="32" rx="5"/>
    <rect x="122" y="304" width="56" height="32" rx="5"/><rect x="186" y="304" width="56" height="32" rx="5"/><rect x="250" y="304" width="56" height="32" rx="5"/><rect x="314" y="304" width="56" height="32" rx="5"/>
    <rect x="122" y="348" width="56" height="32" rx="5"/><rect x="186" y="348" width="56" height="32" rx="5"/><rect x="250" y="348" width="56" height="32" rx="5"/><rect x="314" y="348" width="56" height="32" rx="5"/><rect x="378" y="348" width="56" height="32" rx="5"/>
  </g>
  <g font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">
    <text x="150" y="193">compute</text>
    <text x="150" y="237">compute</text><text x="214" y="237">compute</text>
    <text x="150" y="281">compute</text><text x="214" y="281">compute</text><text x="278" y="281">compute</text>
    <text x="150" y="325">compute</text><text x="214" y="325">compute</text><text x="278" y="325">compute</text><text x="342" y="325">compute</text>
    <text x="150" y="369">compute</text><text x="214" y="369">compute</text><text x="278" y="369">compute</text><text x="342" y="369">compute</text><text x="406" y="369">compute</text>
  </g>
  <text x="246" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">K, V computations over 5 steps: 1+2+3+4+5 = 15</text>
  <text x="246" y="436" text-anchor="middle" font-size="13" fill="#7c2d12">n tokens need about n²/2; slower as sequences grow</text>

  <!-- Right panel -->
  <rect x="492" y="80" width="444" height="380" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="714" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">With KV Cache</text>
  <text x="714" y="132" text-anchor="middle" font-size="12" fill="#1e40af">Compute K, V for the new token only; read past K, V from GPU memory</text>
  <g font-size="13" fill="#374151" text-anchor="middle">
    <text x="618" y="160">token1</text><text x="682" y="160">token2</text><text x="746" y="160">token3</text><text x="810" y="160">token4</text><text x="874" y="160">token5</text>
  </g>
  <g font-size="13" fill="#374151">
    <text x="508" y="193">Step 1</text><text x="508" y="237">Step 2</text><text x="508" y="281">Step 3</text><text x="508" y="325">Step 4</text><text x="508" y="369">Step 5</text>
  </g>
  <!-- cached cells -->
  <g fill="#bfdbfe" stroke="#3b82f6" stroke-width="1">
    <rect x="590" y="216" width="56" height="32" rx="5"/>
    <rect x="590" y="260" width="56" height="32" rx="5"/><rect x="654" y="260" width="56" height="32" rx="5"/>
    <rect x="590" y="304" width="56" height="32" rx="5"/><rect x="654" y="304" width="56" height="32" rx="5"/><rect x="718" y="304" width="56" height="32" rx="5"/>
    <rect x="590" y="348" width="56" height="32" rx="5"/><rect x="654" y="348" width="56" height="32" rx="5"/><rect x="718" y="348" width="56" height="32" rx="5"/><rect x="782" y="348" width="56" height="32" rx="5"/>
  </g>
  <g font-size="11" fill="#1e3a8a" text-anchor="middle">
    <text x="618" y="237">cached</text>
    <text x="618" y="281">cached</text><text x="682" y="281">cached</text>
    <text x="618" y="325">cached</text><text x="682" y="325">cached</text><text x="746" y="325">cached</text>
    <text x="618" y="369">cached</text><text x="682" y="369">cached</text><text x="746" y="369">cached</text><text x="810" y="369">cached</text>
  </g>
  <!-- new cells -->
  <g fill="#fb923c" stroke="#c2410c" stroke-width="1">
    <rect x="590" y="172" width="56" height="32" rx="5"/>
    <rect x="654" y="216" width="56" height="32" rx="5"/>
    <rect x="718" y="260" width="56" height="32" rx="5"/>
    <rect x="782" y="304" width="56" height="32" rx="5"/>
    <rect x="846" y="348" width="56" height="32" rx="5"/>
  </g>
  <g font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">
    <text x="618" y="193">compute</text><text x="682" y="237">compute</text><text x="746" y="281">compute</text><text x="810" y="325">compute</text><text x="874" y="369">compute</text>
  </g>
  <text x="714" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">K, V computations over 5 steps: 5</text>
  <text x="714" y="436" text-anchor="middle" font-size="13" fill="#1e40af">n tokens need only n; the cost is GPU memory</text>

  <!-- legend -->
  <rect x="80" y="482" width="800" height="60" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <rect x="110" y="500" width="28" height="22" rx="4" fill="#fb923c" stroke="#c2410c"/>
  <text x="146" y="516" font-size="13" fill="#374151">K, V newly computed this step (uses GPU compute)</text>
  <rect x="520" y="500" width="28" height="22" rx="4" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="556" y="516" font-size="13" fill="#374151">Read from KV Cache (uses GPU memory)</text>
</svg>
